<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>งานของฉัน — ProFix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* ===== งานของฉัน v5 (2026-11-17) — แบบแอป · ป้ายสถานะสีทึบ · ไอคอนเส้น ===== */
:root{--brand:#175FFF;--brand2:#4F86FF;--ink:#0f172a;--ink2:#5b6476;--ink3:#9aa3b2;--line:#edf0f5;--bg:#f5f7fb;--card:#fff;
  --today:#175FFF;--send:#F08C00;--late:#E5383B;--done:#12A150;--next:#64748B;--closed:#334155;
  --gray-dim:#eef1f5;--yellow-dim:#fff6e0;--green-dim:#e3f6ec;--red-dim:#fdecea;--blue-dim:#e8efff;--tab-h:74px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Anuphan',system-ui,sans-serif;font-size:15px;line-height:1.45;overflow-x:hidden;max-width:100vw;touch-action:manipulation;overscroll-behavior-x:none;
  padding-bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom))}
input,select,textarea{font-size:16px!important;max-width:100%;font-family:inherit}
img,video,canvas,table{max-width:100%}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
svg.i{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.wrap{padding:calc(10px + env(safe-area-inset-top)) 16px 0;max-width:640px;margin:0 auto}

/* ป้ายสถานะทึบ */
.st{display:inline-flex;align-items:center;gap:5px;color:#fff;font-weight:700;font-size:12px;border-radius:8px;padding:4px 9px;white-space:nowrap;line-height:1.2}
.st svg.i{width:13px;height:13px;stroke-width:2.4}
.st.today{background:var(--today)}.st.send{background:var(--send)}.st.late{background:var(--late)}.st.done{background:var(--done)}.st.next{background:var(--next)}.st.closed{background:var(--closed)}
.st.lg{font-size:13.5px;padding:6px 12px;border-radius:10px}
.bt{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;color:#fff;letter-spacing:.3px;line-height:1.3}
.bt.claim{background:#0f766e}.bt.charge{background:#7c3aed}
.lv{display:inline-flex;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--gray-dim);color:var(--ink2);line-height:1.3}
.lv.red{background:var(--red-dim);color:var(--late)}
.od{color:var(--late);font-weight:700}

/* หน้าแรก */
.hello{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ffd29d,#ff9f68);display:flex;align-items:center;justify-content:center;font-weight:700;color:#7a3a00;overflow:hidden;flex:0 0 auto}
.av img{width:100%;height:100%;object-fit:cover}
.hello .t{flex:1;min-width:0}.hello .t small{display:block;font-size:12px;color:var(--ink2)}.hello .t b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:42px;height:42px;border-radius:14px;background:#fff;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(15,23,42,.06);color:var(--ink);flex:0 0 auto}
.ibtn svg.i{width:20px;height:20px}
.ibtn.spin svg{animation:sp .8s linear infinite}
.hero{border-radius:22px;padding:16px;color:#fff;background:linear-gradient(135deg,#3b7bff,#175FFF 60%,#0f47d6);display:flex;align-items:center;gap:12px;box-shadow:0 12px 26px rgba(23,95,255,.3)}
.hero .tx{flex:1;min-width:0}.hero small{font-size:12.5px;opacity:.85}.hero b{display:block;font-size:26px;margin:2px 0}.hero span{font-size:12.5px;opacity:.92}
.ring{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ring div{width:60px;height:60px;border-radius:50%;background:#2a68f5;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;line-height:1}
.ring div small{font-size:9.5px;font-weight:500;opacity:.85;margin-top:3px}
.h3{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;font-weight:700;font-size:15.5px}
.h3 a{font-size:13px;color:var(--brand);font-weight:600;display:flex;align-items:center;gap:2px;text-decoration:none;cursor:pointer}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:#fff;border-radius:18px;padding:12px;box-shadow:0 2px 10px rgba(15,23,42,.04);cursor:pointer;min-width:0}
.cat .n{font-size:30px;font-weight:700;line-height:1;margin:12px 0 3px}
.cat .s{font-size:12px;color:var(--ink2)}
.cat.zero{opacity:.55}
.empty{text-align:center;color:var(--ink3);padding:26px 10px;font-size:14px;background:#fff;border-radius:18px}

/* การ์ดงาน */
.jc{background:#fff;border-radius:18px;padding:13px 13px 13px 15px;margin-bottom:10px;box-shadow:0 2px 10px rgba(15,23,42,.04);position:relative;overflow:hidden;cursor:pointer}
.jc:before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--line))}
.jc .r1{display:flex;align-items:center;gap:6px;min-width:0}
.jc .pr{font-size:12.5px;color:var(--ink2);font-weight:600}
.jc .r1 .st{margin-left:auto}
.jc .br{font-size:16px;font-weight:700;margin:7px 0 3px;line-height:1.3;word-break:break-word}
.jc .mt{font-size:12.5px;color:var(--ink2);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center}
.jc .mt span{display:inline-flex;align-items:center;gap:4px}
.jc .mt svg.i{width:14px;height:14px}
.jc .note{font-size:12.5px;color:#9a4d00;background:#fff3e0;border-radius:10px;padding:6px 9px;margin-top:8px;display:flex;gap:6px}
.act{display:flex;gap:8px;margin-top:11px}
.b{flex:1;border:0;border-radius:12px;padding:11px 8px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:44px}
.b svg.i{width:17px;height:17px}
.b.start{background:var(--brand);color:#fff}.b.send{background:var(--send);color:#fff}.b.quote{background:#fff3e0;color:#b45309}
.b.ghost{background:#f1f4f9;color:var(--ink)}.b.sq{flex:0 0 46px;padding:0}
.b:disabled{opacity:.55}

/* หน้ารายการ */
.tbar{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.tbar b{font-size:20px;flex:1}
.search{background:#fff;border-radius:14px;padding:0 14px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 8px rgba(15,23,42,.04);color:var(--ink3)}
.search input{flex:1;border:0;outline:0;padding:12px 0;background:transparent;color:var(--ink);min-width:0}
.chips{display:flex;gap:7px;overflow-x:auto;margin:12px -16px 14px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:600;background:#fff;color:var(--ink2);display:flex;align-items:center;gap:6px}
.chip em{font-style:normal;font-size:11.5px;background:#eef1f6;border-radius:6px;padding:0 6px}
.chip.on{color:#fff}.chip.on em{background:rgba(255,255,255,.25)}
.chip.on.today{background:var(--today)}.chip.on.send{background:var(--send)}.chip.on.late{background:var(--late)}.chip.on.done{background:var(--done)}.chip.on.next{background:var(--next)}
.filters{background:#fff;border-radius:16px;padding:10px;margin-bottom:12px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr);box-shadow:0 2px 8px rgba(15,23,42,.04)}
.filters select,.filters input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;min-width:0}
.filters .range{display:flex;align-items:center;gap:6px}.filters .range span{font-size:13px;color:var(--ink2)}
.filters .range input{flex:1 1 0;width:0;-webkit-appearance:none;appearance:none;min-height:42px}
.filters .clear{border:0;background:var(--gray-dim);border-radius:10px;padding:9px 12px;font-size:13px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum3 div{background:#fff;border-radius:14px;padding:10px;text-align:center}.sum3 b{display:block;font-size:22px}.sum3 span{font-size:11.5px;color:var(--ink2)}

/* แถบเมนูล่าง */
.tabbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));height:66px;max-width:620px;margin:0 auto;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:24px;box-shadow:0 8px 30px rgba(15,23,42,.14);display:flex;align-items:center;justify-content:space-around;z-index:10}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);font-weight:600;border:0;background:none;width:62px;padding:4px 0}
.tab svg.i{width:23px;height:23px;stroke-width:1.9;opacity:.6}
.tab.on{color:var(--brand)}.tab.on svg.i{opacity:1}
.tab.qr{width:58px;height:58px;border-radius:19px;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;margin-top:-28px;box-shadow:0 8px 20px rgba(23,95,255,.4);justify-content:center}
.tab.qr svg.i{width:27px;height:27px;opacity:1}

/* หน้ารายละเอียด (ซ้อนเต็มจอ) */
#detail{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
#detail.open{display:flex}
.d-head{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg)}
.d-head b{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-close{width:40px;height:40px;border-radius:13px;background:#fff;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(15,23,42,.06);color:var(--ink);font-size:13px;font-weight:700;flex:0 0 auto}
.d-close svg.i{width:20px;height:20px}
.d-body{flex:1;overflow:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.dh{background:#fff;border-radius:22px;padding:16px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.dh .tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dh .br{font-size:21px;font-weight:700;line-height:1.3;margin:12px 0 3px;word-break:break-word}
.dh .sub{font-size:13px;color:var(--ink2)}
.warn{border-radius:14px;padding:10px 12px;font-size:13.5px;margin-top:12px;display:flex;gap:8px;line-height:1.45}
.warn svg.i{margin-top:2px;flex:0 0 auto}
.warn.o{background:#fff3e0;color:#9a4d00}.warn.r{background:var(--red-dim);color:#a4161a}.warn.y{background:#fff8db;color:#7a5b00}
.info{background:#fff;border-radius:20px;margin-top:12px;padding:2px 14px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.ir{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ir:last-child{border-bottom:0}
.ir .ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ir .ic svg.i{width:18px;height:18px}
.ic.c1{background:#eef3ff;color:#175FFF}.ic.c2{background:#fff1e6;color:#E8590C}.ic.c3{background:#e9f8ef;color:#12A150}.ic.c4{background:#f3efff;color:#7048E8}.ic.c5{background:#eef1f5;color:#475569}
.ir .v{flex:1;min-width:0}.ir .v small{display:block;font-size:11.5px;color:var(--ink3)}.ir .v div{font-size:14px;font-weight:600;line-height:1.35;word-break:break-word}
.ir .go{border-radius:10px;padding:8px 11px;font-size:12.5px;font-weight:700;background:#eef3ff;color:var(--brand);white-space:nowrap;text-decoration:none;flex:0 0 auto}
.box{background:#fff;border-radius:20px;margin-top:12px;padding:14px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.box>small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);font-weight:600}
.box p{font-size:14.5px;margin-top:5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.doc-link{display:flex;align-items:center;gap:10px;margin-top:9px;padding:10px 11px;border-radius:12px;background:var(--bg);text-decoration:none;font-size:14px}
.doc-link .doc-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.d-foot{background:#fff;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(15,23,42,.08);display:flex;gap:8px}
.d-foot .b{padding:14px 10px;font-size:16px;border-radius:16px}

/* ประวัติเครื่อง (สแกน QR) + หน้าอื่น ๆ — ใช้คลาสเดิม */
.panel{background:#fff;border-radius:20px;padding:20px 18px;margin-top:10px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.panel h2{margin:0 0 6px;font-size:19px}.panel p{margin:0 0 14px;color:var(--ink2);font-size:14px}
.panel .b{width:100%}
.d-title{font-size:20px;font-weight:700}
.meta{font-size:13px;color:var(--ink2);margin-top:2px}
.d-box{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.d-box.yw{background:var(--yellow-dim)}
.d-grid{background:#fff;border-radius:16px;padding:4px 14px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.d-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.d-row:last-child{border-bottom:0}.d-row span{color:var(--ink2);flex:0 0 auto}.d-row b{text-align:right;font-weight:600;word-break:break-word}
.d-row a{color:var(--brand)}
.card{background:#fff;border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chip2{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--gray-dim);color:var(--ink2);white-space:nowrap}
.chip2.red{background:var(--red-dim);color:var(--late)}.chip2.green{background:var(--green-dim);color:var(--done)}.chip2.yellow{background:var(--yellow-dim);color:#b7791f}.chip2.blue{background:var(--blue-dim);color:var(--brand)}
.detail{font-size:13.5px;margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:10px;white-space:pre-wrap;word-break:break-word}
.sec{margin:18px 0 8px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.sec .n{background:var(--gray-dim);border-radius:999px;padding:0 9px;font-size:12px}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 5px}
.panel input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.msg{margin-top:12px;font-size:13.5px;color:var(--late);min-height:1em}
.loading{text-align:center;padding:60px 20px;color:var(--ink2)}
.spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0b1220;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
.toast.show{opacity:1}
/* หน้า "ฉัน" */
.prof{background:#fff;border-radius:22px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.prof .av{width:58px;height:58px;font-size:18px}
.prof b{font-size:18px;display:block}.prof span{font-size:13px;color:var(--ink2)}
.lg-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.lg-row:last-child{border-bottom:0}.lg-row .st{flex:0 0 auto;min-width:122px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="tool" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></symbol>
<symbol id="alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></symbol>
<symbol id="qr" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/></symbol>
<symbol id="hist" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></symbol>
<symbol id="phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
<symbol id="bld" viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3"/></symbol>
<symbol id="note" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h5"/></symbol>
<symbol id="file" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5"/></symbol>
<symbol id="img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></symbol>
<symbol id="srch" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="snow" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></symbol>
<symbol id="box" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 10h14M9 6.5v1M9 13v3"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>

function assetParam(){const u=new URLSearchParams(location.search);let c=u.get('asset');
  if(!c){const st=u.get('liff.state');if(st){try{c=new URLSearchParams(st.replace(/^[^?]*\?/,'')).get('asset');}catch(e){}}}

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200);}
function todayISO(x){const d=x instanceof Date?x:new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
const TH_DAYS=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'],TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(iso){if(!/^\d{4}-\d{2}-\d{2}/.test(iso||''))return 'ยังไม่ระบุวัน';const d=new Date(iso.slice(0,10)+'T00:00:00');return `${TH_DAYS[d.getDay()]} ${d.getDate()} ${TH_MON[d.getMonth()]}`;}
function thTime(iso){const d=new Date(iso);if(isNaN(d))return '';return d.toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' น.';}

async function api(action,extra={}){

  const d=await r.json().catch(()=>({error:'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'}));
  if(!r.ok||d.error){const e=new Error(d.error||('HTTP '+r.status));e.data=d;e.status=r.status;throw e;}
  return d;
}

// ===== งานของฉัน v5 — หมวดงาน (ต้องตรงกับข้อความ LINE ใน edge tech-line-webhook / tech-notify) =====
// 1 งาน อยู่หมวดเดียว:
//   📅 นัดวันนี้      = วันนัดคือวันนี้ (ทั้งยังไม่เริ่ม และเริ่มแล้ว)
//   🔧 ต้องส่งงาน     = กดเริ่มงานแล้ว (หรือ รอช่างส่งงาน / ต้องแก้ไข) แต่ยังไม่ส่ง — นัดวันอื่น
//   ⏰ เลยนัด/ยังไม่เข้า = เลยวันนัด ยังไม่กดเริ่มงาน
//   ✓ ส่งงานแล้ว      = ส่งรายงานแล้ว / รออนุมัติอะไหล่ / รอ PO — รอแอดมิน
//   นัดล่วงหน้า        = นัดหลังวันนี้ / ยังไม่ระบุวัน (อยู่ในแท็บงาน ไม่นับเป็นหมวดหลัก)
const CAT={
  today:{t:'นัดวันนี้',ic:'cal',hint:'ไปตามนัดวันนี้'},
  send:{t:'ต้องส่งงาน',ic:'tool',hint:'เริ่มแล้ว ยังไม่ส่ง'},
  late:{t:'เลยนัด/ยังไม่เข้า',ic:'alert',hint:'เลยวันนัด ยังไม่กดเริ่ม'},
  done:{t:'ส่งงานแล้ว',ic:'check',hint:'รอแอดมินตรวจ'},
  next:{t:'นัดล่วงหน้า',ic:'cal',hint:'นัดหลังวันนี้'},
  closed:{t:'ปิดงานแล้ว',ic:'check',hint:''}
};
const CAT_ORDER=['today','send','late','done','next'];
const I=(n,st)=>`<svg class="i"${st?` style="${st}"`:''}><use href="#${n}"/></svg>`;
const hasDate=j=>/^\d{4}-\d{2}-\d{2}/.test(j.date||'');
const startDay=j=>j.started&&j.started.at?todayISO(new Date(j.started.at)):'';
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);}
function catOf(j,today){
  today=today||todayISO();
  if(j.done)return 'closed';
  if(j.waitingAdmin)return 'done';
  const d=hasDate(j)?j.date.slice(0,10):'';
  if(d===today)return 'today';
  if(j.inProgress)return 'send';
  if(d&&d<today)return 'late';
  return 'next';
}
// ค้างกี่วัน: ต้องส่งงาน = นับจากวันที่ช้ากว่าระหว่างวันนัดกับวันที่กดเริ่ม · เลยนัด = นับจากวันนัด
function overDays(j,today){
  today=today||todayISO();const c=catOf(j,today);
  if(c==='send'){const d=hasDate(j)?j.date.slice(0,10):'',s=startDay(j);const due=d&&s?(d>s?d:s):(d||s);return due&&due<today?daysBetween(due,today):0;}
  if(c==='late')return daysBetween(j.date.slice(0,10),today);
  return 0;
}
function classify(list){
  const today=todayISO(),c={today:[],send:[],late:[],done:[],next:[]};
  for(const j of list){const k=catOf(j,today);if(c[k])c[k].push(j);}
  const byDate=(a,b)=>String(a.date||'9').localeCompare(String(b.date||'9'));
  c.today.sort((a,b)=>(b.inProgress?1:0)-(a.inProgress?1:0));
  c.send.sort((a,b)=>overDays(b,today)-overDays(a,today));
  c.late.sort(byDate);c.next.sort(byDate);
  c.done.sort((a,b)=>String(b.techSubmittedAt||b.date||'').localeCompare(String(a.techSubmittedAt||a.date||'')));
  return c;
}
const stLabel=(k,lg)=>`<span class="st ${k}${lg?' lg':''}">${I(CAT[k].ic)}${CAT[k].t}</span>`;
function btPill(j){const x=String(j&&j.billType||'').toLowerCase(),k=/claim|เคลม/.test(x)?'claim':/charge|คิดเงิน/.test(x)?'charge':'';return k?`<span class="bt ${k}">${k.toUpperCase()}</span>`:'';}
// ระดับงานแบบสั้น: "Level 1" → L1 · ข้อความยาวจากใบงาน เช่น "PM/Preventive Maintenance Work Order Type Charge" → PM
function lvlShort(v){v=String(v||'').trim();if(!v)return '';if(/preventive|^PM\b/i.test(v))return 'PM';const m=/level\s*(\d+)/i.exec(v)||/^L?\s*(\d+)$/i.exec(v);if(m)return 'L'+m[1];return v.length>14?v.slice(0,12)+'…':v;}
function lvlChip(j){const t=lvlShort(j.level);return t?`<span class="lv ${/^L1$/.test(t)?'red':''}" title="${esc(j.level)}">${esc(t)}</span>`:'';}
function typeIcon(t){return /ตู้|แช่|เย็น/.test(t||'')&&!/แอร์/.test(t||'')?'box':/PM|บำรุง/i.test(t||'')?'snow':/แอร์|air/i.test(t||'')?'snow':'tool';}
function telHref(p){return 'tel:'+esc(String(p).split(/[,/]| หรือ /)[0].replace(/[^\d+]/g,''));}
function mapHref(j){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([j.branch,j.branchAddr].filter(Boolean).join(' '));}

// ===== แท็บ =====
let tab='home',cat='today',q='';
let hist={month:'',from:'',to:'',jobs:null,loading:false};
function setTab(t){
  if(t==='scan')return scanQR();
  tab=t;render();window.scrollTo(0,0);
  if(t==='hist'&&!hist.jobs&&!hist.loading)loadHist();
}
function goCat(k){cat=k;setTab('jobs');}
function tabbar(){
  const b=(k,ic,l)=>`<button class="tab${tab===k?' on':''}" onclick="setTab('${k}')">${I(ic)}${l}</button>`;
  return b('home','home','หน้าแรก')+b('jobs','list','งาน')+`<button class="tab qr" onclick="setTab('scan')" aria-label="สแกน QR เครื่อง">${I('qr')}</button>`+b('hist','hist','ประวัติ')+b('me','user','ฉัน');
}
function showTop(){ $('tabbar').innerHTML=tabbar();$('tabbar').style.display=''; }
async function loadJobs(manual){
  if(!jobs.length)$('app').innerHTML='<div class="loading"><div class="spin"></div>กำลังโหลดงาน...</div>';
  const rb=document.querySelector('.ibtn.rf');if(rb)rb.classList.add('spin');
  try{const d=await api('jobs',{});me=d.tech||me;jobs=d.jobs||[];showTop();render();if(manual)toast('อัปเดตแล้ว');if(manual&&hist.jobs)loadHist();}
  catch(e){if(e.status===403&&e.data&&e.data.tech){me=e.data.tech;return route();}showError(e.message);}
}
function render(){
  $('tabbar').innerHTML=tabbar();
  $('app').innerHTML=tab==='jobs'?viewJobs():tab==='hist'?viewHist():tab==='me'?viewMe():viewHome();
}
const initials=n=>String(n||'ช่าง').replace(/^(นาย|นาง|น\.ส\.|ช่าง)\s*/,'').trim().slice(0,2);
const avHtml=()=>`<div class="av">${lineProfile.picture?`<img src="${esc(lineProfile.picture)}" alt="">`:esc(initials(me&&me.display_name||lineProfile.name))}</div>`;

function viewHome(){
  const c=classify(jobs),today=todayISO();
  const todo=c.today.filter(j=>!j.waitingAdmin).length+c.send.length+c.late.length;
  const sentToday=c.done.filter(j=>String(j.date||'').slice(0,10)===today||String(j.techSubmittedAt||'').slice(0,10)===today).length;
  const allToday=c.today.length+sentToday,pct=allToday?Math.round(sentToday/allToday*100):0;
  const tile=k=>{const n=c[k].length;return `<div class="cat${n?'':' zero'}" onclick="goCat('${k}')">${stLabel(k)}<div class="n" style="color:var(--${k})">${n}</div><div class="s">${n||k!=='late'?CAT[k].hint:'ไม่มีงานเลยนัด'}</div></div>`;};
  const first=[...c.late,...c.today.filter(j=>!j.waitingAdmin),...c.send].slice(0,3);
  return `<div class="hello">${avHtml()}<div class="t"><small>สวัสดี</small><b>${esc(me.display_name||lineProfile.name||'ช่าง')} · ${esc((me.team_names||[])[0]||'ยังไม่ได้ผูกทีม')}</b></div>
      <button class="ibtn rf" onclick="loadJobs(true)" aria-label="รีเฟรช">${I('refresh')}</button></div>
    <div class="hero"><div class="tx"><small>งานที่ยังไม่ส่ง</small><b>${todo} งาน</b><span>วันนี้ ${c.today.length} · ต้องส่ง ${c.send.length} · เลยนัด ${c.late.length}</span></div>
      <div class="ring" style="background:conic-gradient(#fff 0 ${pct}%,rgba(255,255,255,.25) 0)"><div>${sentToday}/${allToday}<small>ส่งวันนี้</small></div></div></div>
    <div class="h3">หมวดงาน</div>
    <div class="grid4">${['today','send','late','done'].map(tile).join('')}</div>
    <div class="h3">ทำก่อน ${first.length?`<a onclick="goCat('${c.late.length?'late':c.today.length?'today':'send'}')">ดูทั้งหมด${I('chev','width:14px;height:14px')}</a>`:''}</div>
    ${first.length?first.map(j=>card(j)).join(''):`<div class="empty">ไม่มีงานค้าง${c.next.length?` · นัดล่วงหน้า ${c.next.length} งาน`:''}</div>`}`;
}
function jobsListHtml(){
  const c=classify(jobs),qq=q.trim().toLowerCase();
  const match=j=>!qq||[j.id,j.branch,j.client,j.type,j.ref].join(' ').toLowerCase().includes(qq);
  const list=qq?[...c.today,...c.send,...c.late,...c.next,...c.done].filter(match):c[cat];
  return list.length?list.map(j=>card(j)).join(''):`<div class="empty">${qq?'ไม่พบงานที่ค้นหา':'ไม่มีงานในหมวดนี้'}</div>`;
}
function chipsHtml(){
  const c=classify(jobs),qq=q.trim();
  return CAT_ORDER.map(k=>`<button class="chip ${k}${!qq&&cat===k?' on':''}" onclick="cat='${k}';q='';render()">${CAT[k].t.replace('/ยังไม่เข้า','')} <em>${c[k].length}</em></button>`).join('');
}
// พิมพ์ค้นหา → อัปเดตเฉพาะรายการ (ไม่วาดช่องค้นหาใหม่ — พิมพ์ไทยบน iPhone ไม่สะดุด)
function onSearch(v){q=v;$('jch').innerHTML=chipsHtml();$('jl').innerHTML=jobsListHtml();}
function viewJobs(){
  return `<div class="tbar"><b>งานของฉัน</b><button class="ibtn rf" onclick="loadJobs(true)" aria-label="รีเฟรช">${I('refresh')}</button></div>
    <div class="search">${I('srch')}<input id="q" type="search" placeholder="ค้นหา PR / สาขา" value="${esc(q)}" oninput="onSearch(this.value)"></div>
    <div class="chips" id="jch">${chipsHtml()}</div>
    <div id="jl">${jobsListHtml()}</div>`;
}
function card(j){
  const k=catOf(j),od=overDays(j);
  const meta=[`<span>${I(typeIcon(j.type))}${esc(j.type||'งาน')}</span>`,
    k==='today'?(j.inProgress&&j.started?`<span>${I('play')}เริ่ม ${esc(hm(j.started.at))}</span>`:''):`<span>${I('cal')}${hasDate(j)?esc(thDate(j.date)):'ยังไม่ระบุวัน'}</span>`,
    od?`<span class="od">${k==='late'?'เลยนัด':'ค้าง'} ${od} วัน</span>`:''].filter(Boolean).join('');
  return `<div class="jc" style="--c:var(--${k})" onclick="openDetail('${esc(j.id)}')">
    <div class="r1"><span class="pr">${esc(j.id)}</span>${btPill(j)}${lvlChip(j)}${stLabel(k)}</div>
    <div class="br">${esc(j.branch||'-')}</div><div class="mt">${meta}</div>
    ${j.reviewNote&&k!=='closed'?`<div class="note">${I('note')}<span>${esc(j.reviewNote)}</span></div>`:''}
    <div class="act" onclick="event.stopPropagation()">${jobActions(j,true)}</div></div>`;
}
function hm(iso){const d=new Date(iso);return isNaN(d)?'':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
// ปุ่มตามขั้นตอน: ยังไม่เริ่ม → เริ่มงาน (กดเมื่อถึงสาขา) → ขออนุมัติ / ส่งงาน · ส่งงานแล้ว → ดู/แก้รายงาน · ปิดงานแล้ว → ไม่มีปุ่ม
function jobActions(j,compact){
  const ph=j.branchPhone||j.phone;
  const tel=ph?`<a class="b ghost sq" href="${telHref(ph)}" aria-label="โทรหาสาขา">${I('phone')}</a>`:'';
  const nd=(j.docs||[]).length;
  const doc=!compact&&nd?'':nd?(nd===1?`<a class="b ghost sq" href="${esc(j.docs[0].url)}" target="_blank" rel="noopener" aria-label="ดูใบงาน">${I('file')}</a>`:`<button class="b ghost sq" onclick="openDetail('${esc(j.id)}',true)" aria-label="ดูใบงาน">${I('file')}</button>`):'';
  if(j.done)return compact?'':tel;
  if(j.waitingAdmin)return `<button class="b ghost" onclick="openSubmit('${esc(j.id)}','')">${I('file')}ดู/แก้รายงาน</button>`+tel+doc;
  if(j.inProgress)return (compact?'':`<button class="b quote" style="flex:0 0 auto;padding:0 14px" onclick="openSubmit('${esc(j.id)}','quote')">${I('wait')}ขออนุมัติ</button>`)
    +`<button class="b send" onclick="openSubmit('${esc(j.id)}','done')">${I('tool')}ส่งงาน</button>`+tel+doc;
  return `<button class="b start" onclick="startJob('${esc(j.id)}',this)">${I('play')}เริ่มงาน</button>`+tel+doc;
}

function histRange(){

}

function monthOptions(){

}

// ===== สแกน QR สติกเกอร์เครื่อง → ประวัติเครื่อง =====
async function scanQR(){
  const take=v=>{v=String(v||'');const m=/[?&](?:asset|code)=([A-Za-z0-9-]+)/.exec(v)||/\b(PF[AQ]-\d{3,})\b/i.exec(v);
    if(m)return openAsset(m[1].toUpperCase());if(/^https?:\/\//.test(v)){location.href=v;return;}toast('QR นี้ไม่ใช่สติกเกอร์เครื่อง');};
  if(!DEMO&&window.liff&&typeof liff.scanCodeV2==='function'){
    try{const r=await liff.scanCodeV2();if(r&&r.value)return take(r.value);return;}catch(e){/* ไม่รองรับ → ให้พิมพ์รหัส */}
  }
  const v=prompt('สแกนจากในไลน์ไม่ได้ — ใช้กล้องมือถือสแกน QR ที่เครื่องได้เลย\nหรือพิมพ์รหัสบนสติกเกอร์ (เช่น PFA-00012)');
  if(v)take(v.trim().toUpperCase());
}
