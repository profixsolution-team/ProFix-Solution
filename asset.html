<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ProFix — เครื่อง</title>
<link rel="icon" href="assets/profix-icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--text:#0b1220;--muted:#64748b;--accent:#175fff;--line:#e3e8f0;--green:#0f9d58;--green-dim:#e3f6ec;--yellow:#b7791f;--yellow-dim:#fff6e0;--red:#d93025;--red-dim:#fdecea;--chip:#eef1f5}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--text:#e2e8f0;--muted:#94a3b8;--line:#243047;--chip:#1e293b;--green-dim:#0f2e22;--yellow-dim:#2e2610;--red-dim:#341616}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:Anuphan,sans-serif;color:var(--text);padding:16px}
.c{width:min(420px,100%);background:var(--card);border-radius:24px;padding:28px 24px;text-align:center;box-shadow:0 10px 40px rgba(15,23,42,.08)}
.logo{width:52px;height:52px;margin:0 auto 10px}
.code{font-size:28px;font-weight:700;letter-spacing:.5px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.m{color:var(--muted);font-size:14px;line-height:1.7}
.info{margin:16px 0 4px;border:1px solid var(--line);border-radius:16px;padding:6px 14px;text-align:left}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row:last-child{border-bottom:0}.row span{color:var(--muted)}.row b{font-weight:600;text-align:right}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--chip);color:var(--muted)}
.chip.g{background:var(--green-dim);color:var(--green)}.chip.y{background:var(--yellow-dim);color:var(--yellow)}.chip.r{background:var(--red-dim);color:var(--red)}
a.b{display:block;margin-top:20px;background:#06c755;color:#fff;text-decoration:none;border-radius:14px;padding:14px;font-weight:600}
a.l{display:inline-block;margin-top:14px;font-size:13px;color:var(--accent);text-decoration:none}
.s{margin-top:6px;font-size:12px;color:var(--muted)}
</style></head><body>
<div class="c">
  <img class="logo" src="assets/profix-icon.svg" alt="ProFix">
  <div class="m">ProFix Solution · ทะเบียนเครื่อง</div>
  <div class="code" id="code">—</div>
  <div id="info"></div>
  <div class="m" id="msg" style="margin-top:12px">เครื่องนี้อยู่ในระบบดูแลบำรุงรักษาของ ProFix<br>หากพบปัญหาการใช้งาน โปรดแจ้งผู้ดูแลสาขา</div>
  <a class="b" id="line" href="#">🔧 ช่าง ProFix: เปิดประวัติเครื่องใน LINE</a>
  <div class="s">ช่างที่ลงทะเบียน "งานของฉัน" แล้ว ไม่ต้องล็อกอินเพิ่ม</div>
  <a class="l" id="open" href="https://console.profixsolution-service.com/">แอดมิน: เปิดในคอนโซล</a>
</div>
<script>
const SUPABASE_URL='https://cfikdkytopyqxvaytiks.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmaWtka3l0b3B5cXh2YXl0aWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MjE1NDksImV4cCI6MjA5NjE5NzU0OX0.VptLL8BeQaNLyy25L_rHauVPnzVMCgVauicpgJIIuDQ';
const LIFF_ID='2012087004-vwA8b0uF'; // LIFF ของหน้า "งานของฉัน" (tech.html)
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDate=iso=>{const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${+m[3]} ${TH_MON[+m[2]-1]} ${+m[1]+543}`:'';};
const c=(new URLSearchParams(location.search).get('c')||'').trim().toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,20);
if(c){
  $('code').textContent=c;document.title='ProFix — '+c;
  $('open').href='https://console.profixsolution-service.com/?asset='+encodeURIComponent(c);
  $('line').href='https://liff.line.me/'+LIFF_ID+'?asset='+encodeURIComponent(c);
  (async()=>{
    try{
      const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/pm_asset_public',{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'},body:JSON.stringify({p_code:c})});
      if(!r.ok)return; // ยังไม่ได้รัน SQL → แสดงแบบเดิม
      const d=await r.json();
      if(d.kind==='blank'){$('msg').innerHTML='สติกเกอร์นี้ยังไม่ได้ผูกกับเครื่อง<br>ช่างผูกได้ตอนทำใบงาน PM ของสาขานี้';return;}
      if(d.kind!=='asset'){$('msg').textContent='ไม่พบรหัสนี้ในทะเบียนเครื่องของ ProFix';return;}
      const cond=d.last_condition||'',cls=!cond?'':/ปกติ/.test(cond)?'g':/เสีย/.test(cond)?'r':'y';
      const row=(k,v)=>v?`<div class="row"><span>${k}</span><b>${v}</b></div>`:'';
      $('info').innerHTML=`<div class="info">${row('ประเภท',esc(d.asset_type))}${row('ยี่ห้อ',esc(d.brand))}${row('ขนาด',esc(d.capacity))}
        ${row('ดูแลล่าสุด',d.last_service?esc(thDate(d.last_service))+(d.last_kind==='repair'?' (ซ่อม)':' (PM)'):'<span class="chip">ยังไม่มีประวัติ</span>')}
        ${cond?row('สภาพล่าสุด',`<span class="chip ${cls}">${esc(cond)}</span>`):''}${d.retired?row('สถานะ','<span class="chip">ปลดระวางแล้ว</span>'):''}</div>`;
    }catch(e){}
  })();
}
</script>
</body></html>
